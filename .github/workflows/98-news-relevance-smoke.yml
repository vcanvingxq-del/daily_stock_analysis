name: 新闻相关度验收（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/98-news-relevance-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 对比 Tavily A股查询策略
        env:
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
        run: |
          python - <<'PY'
          import os
          from tavily import TavilyClient

          keys = [x.strip() for x in (os.getenv('TAVILY_API_KEYS') or '').split(',') if x.strip()]
          if not keys:
              raise SystemExit('TAVILY_API_KEYS 未配置')
          client = TavilyClient(api_key=keys[0])

          tests = [
              ('news_short', {'query': '"浪潮信息"', 'topic': 'news', 'days': 7}),
              ('news_code', {'query': '"浪潮信息" 000977', 'topic': 'news', 'days': 7}),
              ('news_legal', {'query': '"浪潮电子信息产业股份有限公司"', 'topic': 'news', 'days': 7}),
              ('general_week', {'query': '"浪潮信息" 000977', 'topic': 'general', 'time_range': 'week'}),
          ]

          for label, extra in tests:
              print('\n###', label)
              try:
                  result = client.search(
                      search_depth='advanced',
                      max_results=5,
                      include_answer=False,
                      include_raw_content=False,
                      **extra,
                  )
              except Exception as exc:
                  print('ERROR=', type(exc).__name__, str(exc))
                  continue
              rows = result.get('results', [])
              print('count=', len(rows))
              for row in rows:
                  print('-', row.get('title', ''))
                  print('  url=', row.get('url', ''))
                  print('  date=', row.get('published_date') or row.get('publishedDate'))
          PY
