name: 持仓Secret验收（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/99-portfolio-secret-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 安全校验 PORTFOLIO_POSITIONS
        env:
          PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}
        run: |
          python - <<'PY'
          import hashlib, json, os

          raw = os.environ.get('PORTFOLIO_POSITIONS', '')
          if not raw:
              raise SystemExit('PORTFOLIO_POSITIONS 未配置')

          try:
              payload = json.loads(raw)
          except Exception:
              raise SystemExit('PORTFOLIO_POSITIONS 不是有效 JSON')

          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          digest = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          expected = '66db3d9d8627643c12b409d207bc7162c1c62410c6f6fb11f11a3d0dff8171f2'

          active = 0
          for key, value in payload.items():
              if str(key).startswith('_') or not isinstance(value, dict):
                  continue
              try:
                  qty = float(value.get('shares', value.get('quantity', 0)) or 0)
              except (TypeError, ValueError):
                  qty = 0
              if qty > 0:
                  active += 1

          print('secret_parse=PASS')
          print('active_position_count=', active)
          if digest != expected:
              raise SystemExit('Secret 内容与 15:07 最新版不一致')
          print('portfolio_snapshot_match=PASS')
          PY
