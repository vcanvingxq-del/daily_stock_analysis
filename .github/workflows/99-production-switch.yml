name: 持仓增强正式切换（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/99-production-switch.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 正式切换每日分析工作流
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/00-daily-analysis.yml')
          text = path.read_text(encoding='utf-8')
          original = text

          stock_env = "          STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}"
          stock_env_new = stock_env + "\n          # 私有持仓上下文（仅从 Actions Secret 注入）\n          PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}"
          if stock_env not in text:
              raise SystemExit('未找到 STOCK_LIST_CONFIG 锚点，停止切换')
          text = text.replace(stock_env, stock_env_new, 1)

          resolver = '''          if [ -n "${STOCK_LIST_CONFIG:-}" ]; then
            export STOCK_LIST="$STOCK_LIST_CONFIG"
          elif [ -z "${STOCK_LIST:-}" ]; then
            export STOCK_LIST="600519"
          fi'''
          resolver_new = resolver + '''

          # 正式持仓模式：股票列表以 PORTFOLIO_POSITIONS 中实际持有(shares/quantity>0)的标的为准。
          # 这里只输出股票代码；股数、成本、账户资产等私有字段不会写入控制台。
          if [ "$MODE" != "market-only" ]; then
            if [ -z "${PORTFOLIO_POSITIONS:-}" ]; then
              echo '❌ PORTFOLIO_POSITIONS Secret 未配置，正式持仓分析已中止'
              exit 1
            fi
            PORTFOLIO_STOCK_LIST="$(python - <<'PYCODE'
          import json
          import os

          payload = json.loads(os.environ['PORTFOLIO_POSITIONS'])
          codes = []
          for key, value in payload.items():
              if str(key).startswith('_') or not isinstance(value, dict):
                  continue
              qty = value.get('shares', value.get('quantity', 0))
              try:
                  qty = float(qty or 0)
              except (TypeError, ValueError):
                  qty = 0
              if qty > 0:
                  codes.append(str(key).strip())
          print(','.join(codes))
          PYCODE
          )"
            if [ -z "$PORTFOLIO_STOCK_LIST" ]; then
              echo '❌ PORTFOLIO_POSITIONS 中没有可分析的实际持仓'
              exit 1
            fi
            export STOCK_LIST="$PORTFOLIO_STOCK_LIST"
          fi'''
          if resolver not in text:
              raise SystemExit('未找到 STOCK_LIST 解析锚点，停止切换')
          text = text.replace(resolver, resolver_new, 1)

          stocks_cmd = '            python main.py --no-market-review $FORCE_RUN_ARG'
          stocks_cmd_new = '            python portfolio_enhanced_main.py --no-market-review $FORCE_RUN_ARG'
          if stocks_cmd not in text:
              raise SystemExit('未找到 stocks-only 执行命令，停止切换')
          text = text.replace(stocks_cmd, stocks_cmd_new, 1)

          full_cmd = '            python main.py $FORCE_RUN_ARG'
          full_cmd_new = '            python portfolio_enhanced_main.py $FORCE_RUN_ARG'
          if full_cmd not in text:
              raise SystemExit('未找到 full 执行命令，停止切换')
          text = text.replace(full_cmd, full_cmd_new, 1)

          upload_anchor = '''      - name: 上传分析报告
        uses: actions/upload-artifact@v6'''
          upload_new = '''      - name: 清理私有调试日志
        if: always()
        run: |
          # DEBUG 日志包含完整 prompt，可能带持仓成本/账户快照，禁止作为 artifact 上传。
          rm -f logs/stock_analysis_debug_*.log

      - name: 上传分析报告
        uses: actions/upload-artifact@v6'''
          if upload_anchor not in text:
              raise SystemExit('未找到 artifact 上传步骤，停止切换')
          text = text.replace(upload_anchor, upload_new, 1)

          required = [
              "cron: '0 10 * * 1-5'",
              'PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}',
              'python portfolio_enhanced_main.py --no-market-review $FORCE_RUN_ARG',
              'python portfolio_enhanced_main.py $FORCE_RUN_ARG',
              'python main.py --market-review $FORCE_RUN_ARG',
              'rm -f logs/stock_analysis_debug_*.log',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'切换后校验失败，缺少: {marker}')
          if text == original:
              raise SystemExit('文件没有发生变化，停止提交')

          path.write_text(text, encoding='utf-8')
          print('✅ 00-daily-analysis.yml 已切换为持仓增强正式模式')
          PY

      - name: 验证私有持仓 Secret（只显示代码）
        env:
          PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get('PORTFOLIO_POSITIONS', '')
          if not raw:
              raise SystemExit('❌ PORTFOLIO_POSITIONS Secret 不可用')
          payload = json.loads(raw)
          codes = []
          for key, value in payload.items():
              if str(key).startswith('_') or not isinstance(value, dict):
                  continue
              qty = value.get('shares', value.get('quantity', 0))
              try:
                  qty = float(qty or 0)
              except (TypeError, ValueError):
                  qty = 0
              if qty > 0:
                  codes.append(str(key).strip())
          if not codes:
              raise SystemExit('❌ Secret 中没有实际持仓')
          print(f'✅ 实际持仓代码（{len(codes)}只）: ' + ','.join(codes))
          PY

      - name: 提交正式切换
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/00-daily-analysis.yml
          git commit -m 'prod: enable portfolio-aware daily analysis'
          git push origin main
