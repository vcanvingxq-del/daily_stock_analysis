name: 持仓增强正式切换（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/99-production-switch.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 执行正式切换并验证持仓 Secret
        env:
          PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}
        run: python tools/production_switch.py

      - name: 提交正式切换
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/00-daily-analysis.yml
          git commit -m 'prod: enable portfolio-aware daily analysis'
          git push origin main
