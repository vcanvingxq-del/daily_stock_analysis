name: 持仓增强正式切换（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/99-production-switch.yml'

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成正式持仓工作流并验证持仓 Secret
        env:
          PORTFOLIO_POSITIONS: ${{ secrets.PORTFOLIO_POSITIONS }}
        run: python tools/production_switch.py

      - name: 导出补丁后的正式工作流
        uses: actions/upload-artifact@v6
        with:
          name: patched-daily-workflow
          path: .github/workflows/00-daily-analysis.yml
          retention-days: 1
