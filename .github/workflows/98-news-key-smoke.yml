name: 新闻搜索密钥验收（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/98-news-key-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 验证已配置新闻搜索
        env:
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
        run: |
          python - <<'PY'
          import os
          from src.search_service import SearchService

          def keys(name):
              raw = (os.getenv(name) or '').strip()
              return [item.strip() for item in raw.split(',') if item.strip()]

          tavily = keys('TAVILY_API_KEYS')
          anspire = keys('ANSPIRE_API_KEYS')
          configured = []
          if tavily:
              configured.append('Tavily')
          if anspire:
              configured.append('Anspire')
          print('configured_providers=', ','.join(configured) or 'NONE')
          if not configured:
              raise SystemExit('未检测到 TAVILY_API_KEYS 或 ANSPIRE_API_KEYS')

          service = SearchService(tavily_keys=tavily, anspire_keys=anspire)
          response = service.search_stock_news('000977', '浪潮信息', max_results=3)
          print('provider=', response.provider)
          print('success=', response.success)
          print('count=', len(response.results))
          for item in response.results[:3]:
              print('-', item.title[:120])
          if not response.success or not response.results:
              raise SystemExit('已配置搜索源但本轮未返回可用新闻结果')
          PY
