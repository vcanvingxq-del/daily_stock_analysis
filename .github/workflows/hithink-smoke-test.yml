name: HiThink API Smoke Test

on:
  push:
    branches:
      - feat/hithink-finance-integration
    paths:
      - '.github/workflows/hithink-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hithink-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify live HiThink historical K-line
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          from data_provider.hithink_fetcher import HiThinkFetcher

          api_key = (os.getenv("HITHINK_FINANCE_API_KEY") or "").strip()
          if not api_key:
              raise SystemExit("HITHINK_FINANCE_API_KEY is not configured")

          fetcher = HiThinkFetcher(api_key=api_key)
          df = fetcher.get_daily_data(
              "600519",
              start_date="2026-09-21",
              end_date="2026-09-30",
          )

          if df.empty:
              raise SystemExit("HiThink returned no historical rows")

          required = {"date", "open", "high", "low", "close", "volume", "amount", "pct_chg"}
          missing = sorted(required.difference(df.columns))
          if missing:
              raise SystemExit(f"Missing normalized columns: {missing}")

          dates = pd.to_datetime(df["date"])
          first_date = dates.min().date()
          last_date = dates.max().date()

          if first_date.isoformat() < "2026-09-21" or last_date.isoformat() > "2026-09-30":
              raise SystemExit(
                  f"Unexpected HiThink date range after normalization: {first_date} .. {last_date}"
              )

          print(
              "HiThink live smoke test passed: "
              f"rows={len(df)}, first={first_date}, last={last_date}, "
              f"last_close={float(df.iloc[-1]['close']):.4f}"
          )
          PY
